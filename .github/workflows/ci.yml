# Builds and runs the checks on every push to main, every pull request (and by hand).
name: CI
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/check-translations.py"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:
# Read-only token: checks never write to the repository.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Build and checks
    # macOS 26 SDK: the bar and settings use Liquid Glass.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Pinned to a commit so a moved tag can't change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Translations
        run: python3 scripts/check-translations.py
      - name: Build
        run: swift build
      - name: Checks
        run: swift run AkiChecks
