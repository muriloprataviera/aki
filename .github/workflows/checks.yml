# Builds and runs the checks on every push to main, every pull request (and by hand).
name: Checks
on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/check-translations.py"
      - ".github/workflows/checks.yml"
  pull_request:
  workflow_dispatch:
# Read-only token: checks never write to the repository.
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # macOS 26 SDK: the bar and settings use Liquid Glass.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Translations
        run: python3 scripts/check-translations.py
      - name: Build
        run: swift build
      - name: Checks
        run: swift run AkiChecks
